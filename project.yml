name: V2EX
options:
  bundleIdPrefix: com.vibe
  deploymentTarget:
    # The design is explicitly iOS 26 Liquid Glass, so we target the real APIs
    # (glassEffect, GlassEffectContainer, native floating tab bar) rather than
    # approximating them with materials.
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "99LYH6FNPS"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "15"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

# Xcode Cloud 要求共享 scheme(提交到仓库的 xcshareddata/xcschemes),
# 在这里显式声明,xcodegen generate 时会自动生成。
schemes:
  V2EX:
    build:
      targets:
        V2EX: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  V2EX:
    type: application
    platform: iOS
    sources:
      - path: V2EX
        excludes:
          - IconSources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vibe.v2ex
        PRODUCT_NAME: V2EX
        INFOPLIST_FILE: V2EX/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: V2EX
        # 1 = iPhone, 2 = iPad。iPhone 保持竖屏；iPad 走完整方向支持（见 Info.plist）。
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: YES
        GENERATE_INFOPLIST_FILE: NO
