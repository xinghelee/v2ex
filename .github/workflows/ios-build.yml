# 备用出包通道（来自 #1，改为仅手动触发）：
# 日常构建走 Xcode Cloud（每次推 main 自动构建并分发 TestFlight），
# 这里只在需要临时出一个未签名 IPA 时手动跑——macOS runner 分钟计费
# 是 Linux 的 10 倍，不值得每次推送都烧。
name: Build iOS App

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify Xcode toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build unsigned iOS app
        run: |
          set -euo pipefail
          BUILD_DIR="$RUNNER_TEMP/V2EX-iphoneos"
          xcodebuild \
            -project V2EX.xcodeproj \
            -scheme V2EX \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/V2EX-DerivedData" \
            CONFIGURATION_BUILD_DIR="$BUILD_DIR" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/V2EX-iphoneos/V2EX.app"
          IPA_DIR="$RUNNER_TEMP/V2EX-unsigned-ipa"
          IPA_PATH="$RUNNER_TEMP/V2EX-unsigned.ipa"

          test -d "$APP_PATH"
          test ! -d "$APP_PATH/_CodeSignature"
          test ! -f "$APP_PATH/embedded.mobileprovision"

          rm -rf "$IPA_DIR" "$IPA_PATH"
          mkdir -p "$IPA_DIR/Payload"
          cp -R "$APP_PATH" "$IPA_DIR/Payload/"
          (
            cd "$IPA_DIR"
            /usr/bin/zip -qry "$IPA_PATH" Payload
          )

          /usr/bin/unzip -l "$IPA_PATH"

      - name: Upload unsigned IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: V2EX-unsigned-ipa-${{ github.sha }}
          path: ${{ runner.temp }}/V2EX-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
