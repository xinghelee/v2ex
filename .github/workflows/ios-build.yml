name: Build iOS App

on:
  push:
    branches:
      - main
    paths:
      - "V2EX/**"
      - "V2EX.xcodeproj/**"
      - "project.yml"
      - ".github/workflows/ios-build.yml"
  pull_request:
    branches:
      - main
    paths:
      - "V2EX/**"
      - "V2EX.xcodeproj/**"
      - "project.yml"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify Xcode toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project V2EX.xcodeproj \
            -scheme V2EX \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/V2EX-DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Upload simulator app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: V2EX-simulator-${{ github.sha }}
          path: ${{ runner.temp }}/V2EX-DerivedData/Build/Products/Debug-iphonesimulator/V2EX.app
          if-no-files-found: error
          retention-days: 7
